name: Release

# Publish a GitHub release tagged vX.Y.Z (or vX.Y.Z.W) to build the plugin zip, attach it to the
# release, and add it to the shared plugin repository manifest on the gh-pages branch of
# MANIFEST_REPO. Pre-releases get the zip attached but are not added to the manifest.
#
# Pushing to MANIFEST_REPO needs the PLUGIN_REPO_TOKEN secret: a fine-grained token with
# Contents read/write on that repo.

on:
  release:
    types: [published]

permissions:
  contents: write

# Manifest updates from this repo must not race each other. Other plugin repos push to the
# same manifest, so the push below also retries on conflicts.
concurrency:
  group: plugin-repo
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      MANIFEST_REPO: daniel--/jellyfin-plugins
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install jprm

      - name: Work out plugin version
        run: |
          version="${TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$version.0"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z.W"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Use release notes as changelog
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          if [[ -n "$NOTES" ]]; then
            yq -i '.changelog = strenv(NOTES)' build.yaml
          fi

      - name: Build plugin zip
        run: |
          mkdir -p artifacts
          zip=$(jprm --verbosity=debug plugin build . \
            --output=artifacts \
            --version="$VERSION" \
            --dotnet-framework=net10.0 \
            --dotnet-configuration=Release)
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Attach zip to release
        run: gh release upload "$TAG" "$ZIP" --clobber

      - name: Add to plugin repository manifest
        if: ${{ !github.event.release.prerelease }}
        env:
          REPO_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$ZIP")"

          # Another plugin's release may push in between, so start again from the latest manifest.
          for attempt in 1 2 3 4 5; do
            rm -rf repo
            git clone --depth=1 --branch=gh-pages \
              "https://x-access-token:${REPO_TOKEN}@github.com/${MANIFEST_REPO}.git" repo
            jprm --verbosity=debug repo add --plugin-url="$url" repo "$ZIP"
            git -C repo add manifest.json
            git -C repo commit -m "Add Smart Shuffle $VERSION"
            if git -C repo push origin gh-pages; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "::error::Could not push to ${MANIFEST_REPO} after 5 attempts"
          exit 1
