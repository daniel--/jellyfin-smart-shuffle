overview: "Shuffle a set of TV shows while keeping each show's episodes in order"
description: >
  Builds a per-user "Smart Shuffle" playlist from the series in a collection.
  Shows are interleaved randomly, episodes within a show stay in order, and
  progress is tracked by the plugin so the shows keep their watched state and
  stay out of Next Up and Continue Watching.
